[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "patchpilot"
version = "0.1.0"
description = "A human-approved code repair agent for public Python and npm repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "openai>=1.60,<3",
  "langgraph>=0.3,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
patchpilot = "patchpilot.main:run"

[tool.hatch.build.targets.wheel]
packages = ["backend/patchpilot"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
